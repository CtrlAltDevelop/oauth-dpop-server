<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Sign in{% endblock %}</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f4f5f7; color: #1d2330; margin: 0; }
    main { max-width: 26rem; margin: 10vh auto; background: #fff; padding: 2rem;
           border-radius: 8px; box-shadow: 0 1px 3px rgb(0 0 0 / 12%); }
    h1 { font-size: 1.25rem; margin-top: 0; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { padding: .6rem 1.2rem; margin: 1.25rem .5rem 0 0; border-radius: 4px;
             border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #1d4ed8; }
    .error { color: #b91c1c; }
    .muted { color: #5b6475; font-size: .9rem; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
